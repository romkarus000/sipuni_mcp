services:
  sipuni-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: sipuni-mcp:local
    env_file:
      - .env
    restart: unless-stopped
    profiles: ["stdio-mcp"]

  pachca-sipuni-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sipuni-mcp:local
    command: ["node", "dist/pachca-bot.js"]
    env_file:
      - .env
    environment:
      PORT: 3000
      TIME_ZONE: Europe/Moscow
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - default
      - n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  n8n:
    name: n8n_default
    external: true

# MCP stdio image is built by deploy.sh but not started as HTTP.
# n8n reaches the gateway at http://pachca-sipuni-bot:3000/v1/gateway (shared n8n_default network).
